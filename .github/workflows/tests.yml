name: Tests GEM OS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar dependencias (sin PyInstaller)
        run: |
          python3 -m venv .venv
          grep -viE '^\s*pyinstaller' requirements.txt > "$RUNNER_TEMP/req.txt"
          .venv/bin/pip install -q -r "$RUNNER_TEMP/req.txt" pytest

      - name: Tests (sin Tk ni .exe: no corren en Linux sin pantalla)
        run: |
          .venv/bin/python -m pytest tests -q -p no:cacheprovider \
            --ignore=tests/test_dashboard_verify.py \
            --ignore=tests/test_escritorio_paneles.py \
            --ignore=tests/test_exe_portable.py
