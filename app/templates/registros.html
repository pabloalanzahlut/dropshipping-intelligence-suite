{% extends "base.html" %}
{% block title %}Registros{% endblock %}
{% block topbar_title %}
<span style="font-size:12px;color:#4a5080;">GEM OS</span>
<span style="font-size:12px;color:#252844;margin:0 6px;">/</span>
<span style="font-size:12px;font-weight:600;color:#c8d0f0;">Registros</span>
{% endblock %}

{% block content %}
<div x-data="registros()">

  <div class="flex items-start justify-between flex-wrap" style="margin-bottom:20px;gap:12px;">
    <div>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#e8ecff;margin:0 0 4px;">
        Registros · <span style="background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">qué está pasando</span>
      </h1>
      <p style="font-size:12px;color:#4a5080;margin:0;">Avisos y errores del servidor, de la ingesta y de la suite. Lo más reciente arriba.</p>
    </div>
    <label class="flex items-center gap-2" style="font-size:12px;color:#7880b0;cursor:pointer;">
      <input type="checkbox" x-model="auto" @change="programar()" style="accent-color:#22d3ee;"> Actualizar solo cada 5 s
    </label>
  </div>

  <div class="flex gap-2 flex-wrap items-end" style="margin-bottom:14px;">
    <div class="flex gap-2 flex-wrap" role="tablist">
      <template x-for="f in fuentes" :key="f.v">
        <button role="tab" :aria-selected="fuente === f.v" @click="fuente = f.v; cargar()" :class="fuente === f.v ? 'tab-btn active' : 'tab-btn'" x-text="f.t"></button>
      </template>
    </div>
    <div><label class="form-label" for="r-nivel">Nivel mínimo</label>
      <select id="r-nivel" x-model="nivel" @change="cargar()" class="input-field" style="width:130px;">
        <option value="">Todos</option><option value="INFO">Info</option><option value="WARNING">Avisos</option><option value="ERROR">Errores</option>
      </select></div>
    <div style="flex:1;min-width:180px;max-width:320px;"><label class="form-label" for="r-q">Buscar</label>
      <input id="r-q" x-model="q" @input.debounce.350ms="cargar()" type="text" class="input-field" placeholder="Texto…"></div>
    <button @click="cargar()" class="btn-ghost" style="font-size:11px;">Actualizar</button>
  </div>

  <div x-show="error" x-cloak role="alert" style="background:rgba(244,63,94,0.08);border:1px solid rgba(251,113,133,0.25);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:#fb7185;" x-text="error"></div>

  <div style="background:#08091a;border:1px solid #1a1d35;border-radius:12px;overflow:auto;max-height:68vh;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;">
    <template x-for="(e, i) in items" :key="i">
      <div style="display:grid;grid-template-columns:140px 70px 120px 1fr;gap:10px;padding:6px 12px;border-bottom:1px solid rgba(26,29,53,.6);align-items:baseline;">
        <span style="color:#4a5080;" x-text="e.ts"></span>
        <span :style="'font-weight:700;color:' + color(e.nivel)" x-text="e.nivel"></span>
        <span style="color:#7880b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" :title="e.origen" x-text="e.origen"></span>
        <span style="color:#c8d0f0;white-space:pre-wrap;word-break:break-word;" x-text="e.msg"></span>
      </div>
    </template>
    <p x-show="!items.length" style="text-align:center;color:#4a5080;font-family:'Inter',sans-serif;font-size:12px;padding:40px 0;margin:0;"
       x-text="cargando ? 'Cargando…' : 'No hay registros con estos filtros.'"></p>
  </div>
</div>

<script>
function registros() {
  return {
    fuente: 'servidor', nivel: '', q: '', items: [], error: '', cargando: false, auto: false, _t: null, _req: 0,
    fuentes: [{ v: 'servidor', t: 'Servidor' }, { v: 'pipeline', t: 'Ingesta en vivo' }, { v: 'elite', t: 'Suite (estructurado)' }],
    color(n) { return { ERROR: '#fb7185', CRITICAL: '#fb7185', WARNING: '#fbbf24', INFO: '#22d3ee', DEBUG: '#4a5080' }[n] || '#a8b0d8'; },
    init() { this.cargar(); },
    programar() { clearInterval(this._t); if (this.auto) this._t = setInterval(() => this.cargar(), 5000); },
    async cargar() {
      const token = ++this._req; this.cargando = true;
      try {
        const p = new URLSearchParams({ fuente: this.fuente, limite: 300 });
        if (this.nivel) p.set('nivel', this.nivel);
        if (this.q) p.set('q', this.q);
        const r = await fetch('/api/registros?' + p);
        if (!r.ok) throw new Error('Error ' + r.status);
        const d = await r.json();
        if (token === this._req) { this.items = d.items; this.error = ''; }
      } catch (e) { if (token === this._req) this.error = 'No se pudieron leer los registros: ' + e.message; }
      finally { if (token === this._req) this.cargando = false; }
    },
  };
}
</script>
{% endblock %}
