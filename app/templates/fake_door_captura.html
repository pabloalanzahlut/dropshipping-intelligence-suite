<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ titulo }}</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #060810; color: #e8ecff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .caja { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 10px; line-height: 1.3; }
  .hook { font-size: 14px; color: #a8b0d8; margin: 0 0 28px; line-height: 1.5; }
  .mock { width: 100%; aspect-ratio: 1.3; background: linear-gradient(135deg, rgba(34,211,238,0.12), rgba(167,139,250,0.08));
          border: 1px solid #1a1d35; border-radius: 16px; margin-bottom: 24px; display: flex; align-items: center;
          justify-content: center; font-size: 40px; }
  button, input[type=email] {
    width: 100%; padding: 14px 16px; border-radius: 10px; font-size: 15px; border: 1px solid #252844;
  }
  .btn-comprar { background: linear-gradient(90deg, #22d3ee, #34d399); color: #060810; font-weight: 700; border: none;
                 cursor: pointer; margin-bottom: 10px; }
  .btn-comprar:hover { filter: brightness(1.08); }
  input[type=email] { background: #0d0f1f; color: #e8ecff; margin-bottom: 10px; }
  .btn-email { background: #22d3ee; color: #060810; font-weight: 700; border: none; cursor: pointer; }
  p.nota { font-size: 11px; color: #4a5080; margin-top: 16px; }
  .gracias { font-size: 15px; color: #34d399; font-weight: 600; padding: 20px 0; }
</style>
</head>
<body>
  <div class="caja" x-data="fakeDoor()">
    <div class="mock">🛍️</div>
    <h1>{{ titulo }}</h1>
    <p class="hook">{{ hook or "Disponible por tiempo limitado." }}</p>

    <template x-if="paso === 'inicio'">
      <div>
        <button class="btn-comprar" @click="clicComprar()">Comprar ahora</button>
      </div>
    </template>

    <template x-if="paso === 'email'">
      <form @submit.prevent="enviarEmail()">
        <p style="font-size:13px;color:#a8b0d8;margin:0 0 10px;">Se agotaron las unidades de esta tanda — déjanos tu email y te avisamos en cuanto vuelva a haber stock.</p>
        <input type="email" x-model="email" placeholder="tu@email.com" required>
        <button type="submit" class="btn-email">Avisadme</button>
      </form>
    </template>

    <template x-if="paso === 'gracias'">
      <p class="gracias">¡Gracias! Te avisaremos en cuanto esté disponible.</p>
    </template>

    <p class="nota">Esta es una prueba de interés — ningún pago real se procesa aquí.</p>
  </div>

<script>
function fakeDoor() {
  return {
    paso: 'inicio', email: '',
    async _evento(tipo, email) {
      try {
        await fetch('/fd/{{ producto_id }}/evento', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo, email: email || null }) });
      } catch (e) {}
    },
    clicComprar() { this._evento('clic_comprar'); this.paso = 'email'; },
    enviarEmail() { this._evento('email', this.email); this.paso = 'gracias'; }
  }
}
</script>
</body>
</html>
